name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "const pkg=require('./package.json'); const tag=process.env.GITHUB_REF_NAME.replace(/^v/, ''); if (pkg.version !== tag) { console.error(`package.json version ${pkg.version} does not match tag ${tag}`); process.exit(1); }"

      - name: Run tests and build
        run: npm run ci

      - name: Package VSIX
        run: |
          mkdir -p artifacts
          npx vsce package --no-dependencies --allow-missing-repository -o "artifacts/${{ github.event.repository.name }}-${{ github.ref_name || 'manual' }}.vsix"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: artifacts/*.vsix

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.vsix